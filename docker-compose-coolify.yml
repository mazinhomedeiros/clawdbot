services:
  clawdbot-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_DOCKER_APT_PACKAGES: "gh git ca-certificates openssh-client curl jq python3 python3-venv python3-pip uv"
    restart: unless-stopped
    init: true

    environment:
      HOME: /home/node
      TERM: xterm-256color
      PATH: /home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CLAWDBOT_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json


    volumes:
      - clawdbot_config:/home/node/.openclaw
      - clawdbot_workspace:/home/node/clawd

    ports:
      - '127.0.0.1:18789:18789'
    #  - '127.0.0.1:18790:18790'

    command: [
      "node",
      "dist/index.js",
      "gateway","--bind",
      "lan","--port",
      "18789",
      "--allow-unconfigured"
      ]

volumes:
  clawdbot_config:
  clawdbot_workspace:


