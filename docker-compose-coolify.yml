services:
  clawdbot-gateway:
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true

    environment:
      HOME: /home/node
      TERM: xterm-256color
      CLAWDBOT_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/moltbot.json

    volumes:
      - clawdbot_config:/home/node/.openclaw
      - clawdbot_workspace:/home/node/clawd

    ports:
      - '127.0.0.1:18789:18789'
    #  - '127.0.0.1:18790:18790'

    command: ["node","dist/index.js","gateway"]

volumes:
  clawdbot_config:
  clawdbot_workspace:


